<!DOCTYPE html>
<html>
<head>
    <title>Cupid Times | Shoo ❤️</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
        body {
            margin: 0;
            background: #e8dfcf;
            font-family: "Georgia", serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .cover {
            cursor: pointer;
        }

        .cover h1 {
            font-size: 32px;
            letter-spacing: 3px;
        }

        .cover p {
            font-style: italic;
            margin-top: 10px;
        }

        .hidden {
            display: none;
        }

        .newspaper {
            width: 100%;
            height: 100vh;
            background: #e8dfcf;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        img {
            max-width: 90%;
            max-height: 90vh;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.2);
        }

        .fade-in {
            animation: fade 2s ease-in-out forwards;
            opacity: 0;
        }

        @keyframes fade {
            to {
                opacity: 1;
            }
        }

        .footer-text {
            position: absolute;
            bottom: 30px;
            font-size: 14px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<!-- COVER PAGE -->
<div class="cover" onclick="openPaper()">
    <h1>CUPID TIMES</h1>
    <p>Tap to Read Today’s Headline, Shoo 🖤</p>
</div>

<!-- NEWSPAPER PAGE -->
<div id="paper" class="newspaper hidden">
    <img src="valentine.png" class="fade-in">

    <!-- Background Music -->
    <iframe width="0" height="0" 
        src="https://www.youtube.com/embed/YOUTUBE_VIDEO_ID?autoplay=1&loop=1&playlist=YOUTUBE_VIDEO_ID"
        frameborder="0" allow="autoplay">
    </iframe>

    <div class="footer-text">
        From Jesse, With Love — Valentine’s Day 2026
    </div>
</div>

<script>
    function openPaper() {
        document.querySelector('.cover').style.display = 'none';
        document.getElementById('paper').classList.remove('hidden');
    }
</script>

</body>
</html>
