<!DOCTYPE html>
<html>
<head>
    <title>Cupid Times | Shoo ❤️</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
        body {
            margin: 0;
            background: #e8dfcf;
            font-family: "Georgia", serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .cover {
            cursor: pointer;
        }

        .cover h1 {
            font-size: 32px;
            letter-spacing: 3px;
        }

        .cover p {
            font-style: italic;
            margin-top: 10px;
        }

        .hidden {
            display: none;
        }

        .newspaper {
            width: 100%;
            height: 100vh;
            background: #e8dfcf;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            flex-direction: column;
        }

        img {
            max-width: 90%;
            max-height: 80vh;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.2);
        }

        .fade-in {
            animation: fade 2s ease-in-out forwards;
            opacity: 0;
        }

        @keyframes fade {
            to {
                opacity: 1;
            }
        }

        .footer-text {
            position: absolute;
            bottom: 30px;
            font-size: 14px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<!-- COVER PAGE -->
<div class="cover" onclick="openPaper()">
    <h1>CUPID TIMES</h1>
    <p>Tap to Read Today’s Headline, Shoo 🖤</p>
</div>

<!-- NEWSPAPER PAGE -->
<div id="paper" class="newspaper hidden">
    <img src="valentine.png" class="fade-in">
    <div id="music-container"></div>
    <div class="footer-text">
        From Jesse, With Love — Valentine’s Day 2026
    </div>
</div>

<script>
    function openPaper() {
        // Hide cover, show newspaper
        document.querySelector('.cover').style.display = 'none';
        const paper = document.getElementById('paper');
        paper.classList.remove('hidden');

        // Add music iframe dynamically
        const musicContainer = document.getElementById('music-container');
        const iframe = document.createElement('iframe');
        iframe.width = 0;
        iframe.height = 0;
        iframe.src = "https://www.youtube.com/embed/s4ErQRLTi54?autoplay=1&loop=1&playlist=s4ErQRLTi54";
        iframe.frameBorder = 0;
        iframe.allow = "autoplay; encrypted-media";
        musicContainer.appendChild(iframe);
    }
</script>

</body>
</html>
